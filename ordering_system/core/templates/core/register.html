{% extends 'core/base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-4 rounded-3" style="max-width: 450px; width: 100%;">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Create Account</h2>
            <p class="text-muted">Sign up to get started!</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label">Username</label>
                <input type="text" name="username" class="form-control form-control-lg" id="id_username"
                    placeholder="Enter your username">
            </div>
            <div class="mb-3">
                <label for="id_email" class="form-label">Email</label>
                <input type="email" name="email" class="form-control form-control-lg" id="id_email"
                    placeholder="Enter your email">
            </div>
            <div class="mb-3">
                <label for="id_password1" class="form-label">Password</label>
                <input type="password" name="password1" class="form-control form-control-lg" id="id_password1"
                    placeholder="Enter password">
            </div>
            <div class="mb-3">
                <label for="id_password2" class="form-label">Confirm Password</label>
                <input type="password" name="password2" class="form-control form-control-lg" id="id_password2"
                    placeholder="Re-enter password">
            </div>
            <button type="submit" class="btn btn-success btn-lg w-100 shadow-sm">Register</button>
        </form>
        <p class="text-center text-muted mt-3 mb-0">
            Already have an account? <a href="{% url 'login' %}" class="text-success fw-semibold">Login</a>
        </p>
    </div>
</div>
{% endblock %}
