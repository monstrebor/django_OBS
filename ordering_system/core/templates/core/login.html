{% extends 'core/base.html' %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-4 rounded-3" style="max-width: 450px; width: 100%;">

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <h2 class="text-center mb-4">Login</h2>

        <form method="post" action="{% url 'user-login' %}">
            {% csrf_token %}

            <div class="mb-3">
                <label for="id_username" class="form-label">Username</label>
                <input type="text" name="username" id="id_username" class="form-control form-control-lg"
                    placeholder="Enter your username" value="{{ request.POST.username }}">
            </div>

            <div class="mb-3">
                <label for="id_password" class="form-label">Password</label>
                <input type="password" name="password" id="id_password" class="form-control form-control-lg"
                    placeholder="Enter your password">
            </div>

            <button type="submit" class="btn btn-success btn-lg w-100 shadow-sm">Login</button>
        </form>

    </div>
</div>
{% endblock %}
